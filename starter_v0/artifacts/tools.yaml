# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user only when essential information is genuinely missing or when confirmation is required before a side effect. Do not use this tool when the request or conversation already contains the needed account handle or URL. Use response_type=text for missing information. Use response_type=yes_no whenever the user asks to send post publish or otherwise cause an external side effect; this confirmation boundary takes precedence over asking for more payload details in the current call."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Get recent posts authored by one specific account. Use this for posts FROM a named person or handle; do not use it for posts ABOUT a topic. Convert well-known names to their canonical handles when unambiguous: Sam Altman -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy. If no account can be recovered from the current request or conversation context, use clarify instead. Preserve an explicit requested count in limit."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without the leading @"}
        limit: {type: integer, default: 5, description: "Exact requested post count; default 5 when unspecified"}
      required: [screenname]

  - name: social_search
    description: "Search social posts from many accounts by topic or keyword. Use this for what people are saying ABOUT a subject; use timeline instead for posts FROM one account. Use search_type=Top for popular/top requests and Latest otherwise. Preserve an explicit requested count in limit."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "The subject or keywords to search across social posts"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top for popular/top requests; Latest for recent or unspecified sorting"}
        limit: {type: integer, default: 5, description: "Exact requested result count; default 5 when unspecified"}
      required: [query]

  - name: lookup
    description: "Search the public web for information or news. Use topic=news when the user asks for news and topic=general otherwise. Normalize today to timeframe=day and this week to timeframe=week. Keep query focused on the requested subject rather than adding filler words such as news. Do not use for social-only searches or when the user already supplied a URL to read."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Focused web-search subject or keywords"}
        topic: {type: string, enum: [general, news], default: "general", description: "news for news/current-event requests; general otherwise"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=today; week=this week; month=this month; year=this year"}
        max_results: {type: integer, default: 5, description: "Exact requested result count; default 5 when unspecified"}
      required: [query]

  - name: fetch
    description: "Read and extract content from a specific URL already supplied by the user or conversation context. When a URL is present, copy that exact URL into the url argument and use this tool directly; do not ask for the URL again and do not replace it with a guessed URL. Do not use for broad web discovery."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "The exact absolute URL supplied by the user or conversation context"}
      required: [url]

  - name: format
    description: "Format research items that are already available into a markdown digest. This tool does not search or fetch new information; call it only after source items have been obtained."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
